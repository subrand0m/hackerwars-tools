<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPC-ALL // HackerWars Round 73</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e17;
  --surface:#0d1220;
  --surface-hi:rgba(255,255,255,0.02);
  --border:#1a2744;
  --border-hi:#26365c;
  --text:#e8f0fe;
  --muted:#a0b4cc;
  --dim:#6a8099;
  --dimmer:#4a6fa5;
  --dimmest:#2a3f66;
  --accent:#00ff88;
  --accent-dim:rgba(0,255,136,0.25);
  --cyan:#00ccff;
  --purple:#8844ff;
  --purple-lt:#aa88ff;
  --red:#ff5555;
  --gold:#ffcc55;
  --mono-data: 'JetBrains Mono', monospace;
  --mono-disp: 'JetBrains Mono', monospace;
  --sans: 'Inter', sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth; background:var(--bg);}
body{
  margin:0;
  background:var(--bg);
  color:var(--muted);
  font-family:var(--sans);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent);color:#04170c;}
a{color:var(--accent);}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:50;
  background:rgba(10,14,23,0.85);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
}
.header-inner{
  max-width:1400px; margin:0 auto; padding:16px 24px 18px;
}
.topbar-accent{
  height:3px; background:linear-gradient(90deg, var(--accent), var(--cyan), var(--purple));
  margin:-16px -24px 18px;
}
.brand-row{
  display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
.brand{
  font-family:var(--mono-disp); font-weight:800; letter-spacing:1.5px;
  font-size:19px; color:var(--text); display:flex; align-items:center; gap:10px;
  text-transform:uppercase;
}
.brand .prompt{color:var(--accent);}
.brand .cursor{
  display:inline-block; width:9px; height:16px; background:var(--accent);
  animation:blink 1.1s steps(1) infinite; margin-left:2px; vertical-align:-2px;
}
@keyframes blink{ 50%{opacity:0;} }
.subline{color:var(--dimmer); font-size:12px; letter-spacing:0.3px; font-family:var(--mono-data); margin-top:4px;}
.round-badge{
  font-family:var(--mono-data); font-size:11px; font-weight:700; color:var(--accent);
  border:1px solid var(--accent-dim); background:rgba(0,255,136,0.06);
  padding:4px 10px; border-radius:6px; letter-spacing:1px;
}

.searchwrap{margin-top:18px;}
.search-line{
  display:flex; align-items:center; gap:10px;
  background:var(--surface-hi); border:1px solid var(--border);
  border-radius:10px; padding:11px 16px;
  transition:border-color .15s, box-shadow .15s;
}
.search-line:focus-within{
  border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,255,136,0.10);
}
.search-line .glyph{color:var(--accent); font-weight:700; font-size:14px; font-family:var(--mono-data);}
.search-line input{
  flex:1; background:transparent; border:none; outline:none;
  color:var(--text); font-family:var(--mono-data); font-size:14.5px;
}
.search-line input::placeholder{color:var(--dim);}
.search-line .clear-btn{
  color:var(--dim); background:none; border:1px solid var(--border-hi);
  border-radius:6px; padding:4px 10px; font-family:var(--mono-data); font-size:11px;
  cursor:pointer; display:none; letter-spacing:0.5px;
}
.search-line .clear-btn:hover{color:var(--text); border-color:var(--accent);}

.filter-row{
  display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:center;
}
.filter-row .flabel{color:var(--dim); font-size:11px; letter-spacing:1px; margin-right:2px; font-family:var(--mono-data); text-transform:uppercase;}

.loadout-row{
  display:flex; gap:14px; margin-top:12px; flex-wrap:wrap; align-items:center;
  padding:10px 12px; background:var(--surface-hi); border:1px solid var(--border); border-radius:10px;
}
.loadout-row .flabel{color:var(--dim); font-size:11px; letter-spacing:1px; margin-right:2px; font-family:var(--mono-data); text-transform:uppercase;}
.load-ctl{display:flex; align-items:center; gap:6px; font-family:var(--mono-data); font-size:11px; color:var(--dim);}
.load-ctl input{
  width:64px; background:var(--bg); border:1px solid var(--border-hi); border-radius:6px;
  color:var(--text); font-family:var(--mono-data); font-size:12px; padding:5px 7px; outline:none;
}
.load-ctl input:focus{border-color:var(--accent);}
.load-ctl.btc-ctl input{width:88px;}
.load-ctl.btc-ctl{color:var(--gold);}
.loadout-hint{
  margin-top:8px; font-size:11px; color:var(--gold); font-family:var(--mono-data);
  display:none;
}
.loadout-hint.show{display:block;}
.load-ctl.btc-ctl input{border-color:rgba(255,204,85,0.35);}
.chip{
  font-family:var(--mono-data); font-size:11px; font-weight:600; letter-spacing:0.5px;
  padding:6px 12px; border-radius:7px; border:1px solid var(--border-hi);
  background:var(--surface-hi); color:var(--dim); cursor:pointer;
  user-select:none; transition:all .12s;
}
.chip:hover{color:var(--text); border-color:var(--dim);}
.chip.active{color:#04170c; border-color:transparent; font-weight:700;}

.status-line{
  margin-top:12px; font-size:12px; color:var(--dim); font-family:var(--mono-data);
  display:flex; gap:14px; flex-wrap:wrap; align-items:center;
}
.status-line b{color:var(--text);}
.status-line .hit{color:var(--accent); font-weight:700;}
.copy-btn{
  display:inline-flex; align-items:center; justify-content:center;
  width:26px; height:22px; border-radius:5px; border:1px solid var(--border-hi);
  background:var(--surface-hi); color:var(--dim); cursor:pointer; flex-shrink:0;
  transition:all .12s;
}
.copy-btn:hover{color:var(--accent); border-color:var(--accent); background:rgba(0,255,136,0.06);}
.copy-btn svg{width:13px; height:13px;}
.copy-btn.copied{color:var(--accent); border-color:var(--accent); background:rgba(0,255,136,0.10);}

/* ---------- grid ---------- */
main{max-width:1400px; margin:0 auto; padding:26px 24px;}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(330px, 1fr));
  gap:18px;
}
.empty-state{
  text-align:center; padding:80px 20px; color:var(--dim);
  font-size:14px; display:none; font-family:var(--mono-data);
}
.empty-state .big{font-size:28px; color:var(--dimmest); margin-bottom:10px;}

/* ---------- card ---------- */
.card{
  background:linear-gradient(180deg, var(--surface-hi), transparent), var(--surface);
  border:1px solid var(--border);
  border-radius:14px; overflow:hidden;
  display:flex; flex-direction:column;
  position:relative;
  transition:border-color .15s ease, transform .15s ease;
}
.card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:var(--card-accent, var(--accent));
}
.card:hover{border-color:var(--border-hi); transform:translateY(-2px);}
.card.dimmed{opacity:0.25; filter:saturate(0.4);}

.card-head{
  padding:14px 16px 11px; border-bottom:1px solid var(--border);
  display:flex; align-items:flex-start; justify-content:space-between; gap:8px;
}
.card-head-l{min-width:0;}
.cat-badge{
  display:inline-block; font-size:10px; font-weight:700; letter-spacing:1.5px;
  padding:3px 8px; border-radius:5px; margin-bottom:7px;
  border:1px solid currentColor; font-family:var(--mono-data);
  text-transform:uppercase;
}
.npc-name{
  font-family:var(--mono-disp); font-weight:700; font-size:14.5px;
  color:var(--text); line-height:1.3; word-break:break-word; letter-spacing:0.2px;
}
.npc-note{font-size:10.5px; color:var(--dim); margin-top:3px; letter-spacing:.03em; font-family:var(--mono-data);}
.ip-pill{
  font-family:var(--mono-data); font-size:11.5px; color:var(--accent);
  background:rgba(0,255,136,0.06); border:1px solid var(--accent-dim);
  padding:4px 9px; border-radius:6px; white-space:nowrap; cursor:pointer;
  flex-shrink:0;
}
.ip-pill:hover{background:rgba(0,255,136,0.14);}
.v-spam{ color:#4da6ff; background:rgba(77,166,255,0.10); border:1px solid rgba(77,166,255,0.35); }
.v-miner{ color:var(--purple-lt); background:rgba(170,136,255,0.10); border:1px solid rgba(170,136,255,0.35); }
.v-warez{ color:var(--accent); background:rgba(0,255,136,0.10); border:1px solid rgba(0,255,136,0.35); }
.virus-chip.v-spam{ color:#4da6ff; border-color:rgba(77,166,255,0.35); }
.virus-chip.v-miner{ color:var(--purple-lt); border-color:rgba(170,136,255,0.35); }
.virus-chip.v-warez{ color:var(--accent); border-color:rgba(0,255,136,0.35); }
.virus-chip.v-spam.active{ background:#4da6ff; color:#04101c; border-color:transparent; }
.virus-chip.v-miner.active{ background:var(--purple-lt); color:#1a0d33; border-color:transparent; }
.virus-chip.v-warez.active{ background:var(--accent); color:#04170c; border-color:transparent; }
.num-badge{
  font-size:10px; color:var(--dimmest); font-family:var(--mono-data);
  margin-top:5px; text-align:right;
}
.rate-row{
  display:flex; flex-direction:column; gap:3px; margin-top:6px; align-items:flex-end;
}
.rate-line{
  font-family:var(--mono-data); font-size:9.5px; font-weight:600; letter-spacing:.01em;
  padding:2px 7px; border-radius:5px; border:1px solid transparent; white-space:nowrap;
  opacity:0.5;
}
.rate-line.rl-spam{color:#4da6ff;}
.rate-line.rl-warez{color:var(--accent);}
.rate-line.rl-miner{color:var(--purple-lt);}
.rate-line.best{opacity:1; font-weight:800;}
.rate-line.best.rl-spam{background:rgba(77,166,255,0.14); border-color:#4da6ff;}
.rate-line.best.rl-warez{background:rgba(0,255,136,0.14); border-color:var(--accent);}
.rate-line.best.rl-miner{background:rgba(170,136,255,0.14); border-color:var(--purple-lt);}

.stat-strip{
  display:grid; grid-template-columns:repeat(5,1fr); gap:6px;
  padding:12px 14px; border-bottom:1px solid var(--border);
}
.stat-box{
  background:var(--bg); border:1px solid var(--border);
  border-radius:10px; padding:5px 3px; text-align:center;
  height:38px; box-sizing:border-box; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.stat-box .k{font-size:8.5px; color:var(--dimmer); letter-spacing:.08em; font-family:var(--mono-data); white-space:nowrap;}
.stat-box .v{font-size:11px; color:var(--muted); font-weight:600; margin-top:2px; font-family:var(--mono-data); white-space:nowrap;}

.soft-grid{
  display:grid; grid-template-columns:repeat(auto-fill, 56px);
  grid-auto-rows:50px;
  justify-content:space-between; align-items:start;
  gap:6px; padding:12px 14px; flex:1;
}
.soft-box{
  background:var(--bg); border:1px solid var(--border);
  border-radius:10px; padding:5px 3px; text-align:center;
  height:50px; box-sizing:border-box; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:all .12s;
}
.soft-box .code{
  font-size:9px; font-weight:700; color:var(--dim); letter-spacing:.04em;
  font-family:var(--mono-data); white-space:nowrap;
}
.soft-box .ver{font-size:11px; color:var(--text); font-weight:700; margin-top:3px; font-family:var(--mono-data); white-space:nowrap;}
.soft-box .sz{font-size:9px; color:var(--muted); margin-top:1px; font-family:var(--mono-data); white-space:nowrap;}
.soft-box.match{
  border-color:var(--accent); background:rgba(0,255,136,0.08);
  box-shadow:0 0 0 1px var(--accent), 0 0 12px rgba(0,255,136,0.20);
}
.soft-box.match .code{color:var(--accent);}
.no-soft{
  grid-column:1/-1; color:var(--dimmest); font-size:11px; text-align:center; padding:14px 0;
  font-family:var(--mono-data);
}

.riddle-box{
  margin:0 14px 12px; padding:9px 11px; background:rgba(136,68,255,0.04);
  border:1px solid rgba(136,68,255,0.2); border-radius:8px; font-size:11.5px;
}
.riddle-box .q{color:var(--muted);}
.riddle-box .q b{color:var(--purple-lt); font-weight:700; font-family:var(--mono-data); letter-spacing:0.5px;}
.riddle-box .a{color:var(--dim); margin-top:4px;}
.riddle-box .a b{color:var(--text); font-family:var(--mono-data); letter-spacing:0.5px;}

footer{
  max-width:1400px; margin:0 auto; padding:34px 24px 60px;
  color:var(--dimmest); font-size:11px; letter-spacing:.5px; text-align:center;
  font-family:var(--mono-data); border-top:1px solid var(--border);
}
footer .p{color:var(--accent);}

@media (max-width:520px){
  .grid{grid-template-columns:1fr;}
  .brand{font-size:16px;}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="topbar-accent"></div>
    <div class="brand-row">
      <div class="brand"><span class="prompt">&gt;_</span> NPC-ALL <span class="cursor"></span></div>
      <div class="round-badge">ROUND 73</div>
    </div>
    <div class="subline">// live index &middot; every NPC, IP, and software loadout in the round file</div>

    <div class="searchwrap">
      <div class="search-line">
        <span class="glyph">$</span>
        <input id="search" type="text" placeholder="grep -i vwarez, or a name, IP, tool, category..." autocomplete="off" spellcheck="false">
        <button class="clear-btn" id="clearBtn">clear</button>
      </div>
      <div class="filter-row" id="catFilters">
        <span class="flabel">filter:</span>
      </div>
      <div class="filter-row" id="virusFilters">
        <span class="flabel">best upload:</span>
      </div>
      <div class="loadout-row" id="loadoutRow">
        <span class="flabel">your loadout:</span>
        <label class="load-ctl"><span>Warez v</span><input type="number" id="lv-warez" min="1" max="99" step="0.1"></label>
        <label class="load-ctl"><span>Spam v</span><input type="number" id="lv-spam" min="1" max="99" step="0.1"></label>
        <label class="load-ctl"><span>Miner v</span><input type="number" id="lv-miner" min="1" max="99" step="0.1"></label>
        <label class="load-ctl"><span>Collector v</span><input type="number" id="lv-collector" min="0" max="99" step="0.1"></label>
        <label class="load-ctl btc-ctl" title="Miner mines a fixed BTC/hr based on CPU/version/collector — this converts it to $/hr and can flip whether Miner beats Spam/Warez."><span>BTC price $</span><input type="number" id="lv-btc" min="0" step="1" placeholder="e.g. 77274"></label>
      </div>
      <div class="loadout-hint" id="loadoutHint"></div>
      <div class="status-line">
        <span><b id="hitCount">0</b> / <span id="totalCount">0</span> npcs matching</span>
        <button class="copy-btn" id="copyIpsBtn" title="copy visible IP addresses">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="14" width="16" height="6" rx="1.5"></rect>
            <path d="M12 3v9"></path>
            <path d="M8 8l4 4 4-4"></path>
          </svg>
        </button>
        <button class="copy-btn" id="downloadAutoInfectBtn" title="download autoInfect.md (visible IPs + best upload)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
            <path d="M14 3v6h6"></path>
            <path d="M12 12v6"></path>
            <path d="M9.5 15.5 12 18l2.5-2.5"></path>
          </svg>
        </button>
        <span id="softHint"></span>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState">
    <div class="big">¯\_(ツ)_/¯</div>
    no NPCs match that query &mdash; try a tool code like <code>vwarez</code>, <code>vminer</code>, or a name/IP fragment
  </div>
</main>

<footer>
</footer>

// Earning-rate constants + version/collector multipliers.
// Warez/Spam are straight $/hr: rate = BASE_RATE x its own stat x virusPercent(yourVersion) x collectorBonus(yourCollector):
//   Warez -> NET x $3.00/Mbit/hr
//   Spam  -> RAM x $0.0501/MB/hr
// Miner is different: mining produces a fixed amount of BTC/hr (driven by CPU/version/
// collector, NOT by price) — that BTC only becomes dollars once you sell it, so
// minerDollarPerHr = minerBtcPerHr x currentBtcPrice. Changing the BTC price box moves the
// dollar figure directly, which can flip whether Miner beats Spam/Warez.
// MINER_BTC_RATE (BTC/GHz/hr at miner v1.0 / collector v0) is anchored so that, at the
// reference BTC price below, it reproduces the dev-confirmed $100/GHz/hr baseline —
// i.e. it's the same verified constant, just re-expressed in BTC instead of dollars.
const WAREZ_RATE = 3.00;      // $/Mbit/hr
const SPAM_RATE  = 0.0501;    // $/MB/hr
const K_M        = 100;       // $/GHz/hr at v1.0 / collector v0 (reference dollar yield)
const BTC_REF_PRICE  = 77274; // reference BTC price the $100/GHz/hr baseline is anchored to
const MINER_BTC_RATE = K_M / BTC_REF_PRICE; // BTC/GHz/hr at v1.0 / collector v0

function virusPercent(version){ return (version * 10 / 1000) * 2 + 1; }
function collectorBonus(collectorVersion){ return 1 + collectorVersion / 100; }

const LOADOUT_KEY = 'npcAllLoadoutV1';
// Defaults: v1.0 for warez/spam/miner (the most commonly-uploaded version), and
// collector v12 (the highest VCOL version found on any NPC in this file, so it's
// the best achievable purely by stealing from NPCs, no research needed).
const loadout = Object.assign({warez:1, spam:1, miner:1, collector:12, btc:BTC_REF_PRICE}, (() => {
  try{
    const raw = localStorage.getItem(LOADOUT_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
})());
function saveLoadout(){
  try{ localStorage.setItem(LOADOUT_KEY, JSON.stringify(loadout)); }catch(e){}
}

function bestVirus(rec){
  const net = rec.net || 0;      // Mbit/s
  const ram = rec.ram || 0;      // MB
  const cpuGhz = (rec.cpu || 0) / 1000; // MHz -> GHz
  const col = collectorBonus(loadout.collector);
  const warez = WAREZ_RATE * net * virusPercent(loadout.warez) * col;
  const spam  = SPAM_RATE  * ram * virusPercent(loadout.spam)  * col;

  const minerBtcPerHr = cpuGhz * MINER_BTC_RATE * virusPercent(loadout.miner) * col;
  const hasBtcPrice = loadout.btc && loadout.btc > 0;
  const miner = minerBtcPerHr * (hasBtcPrice ? loadout.btc : BTC_REF_PRICE);

  const best = Math.max(warez, spam, miner);
  const type = best === warez ? 'WAREZ' : (best === spam ? 'SPAM' : 'MINER');
  const cls = best === warez ? 'v-warez' : (best === spam ? 'v-spam' : 'v-miner');
  return {type, cls, rate:best, warez, spam, miner, minerBtc:minerBtcPerHr};
}

});

function fmtSize(mb){
  if(mb == null) return '';
  if(mb >= 1024) return (mb/1024).toFixed(1)+'GB';
  return Math.round(mb)+'MB';
}
function fmtNum(n){
  if(n == null) return '—';
  if(Number.isInteger(n)) return n.toString();
  return n.toString();
}


function cardHTML(rec, term){
  const meta = CAT_META[rec.cat] || {short:'?',color:'#888'};
  const best = rec._best;
  const softEntries = Object.entries(rec.soft || {});
  let softHTML = '';
  if(softEntries.length === 0){
    softHTML = '<div class="no-soft">no software loadout</div>';
  } else {
    softHTML = softEntries.map(([code,info]) => {
      const lc = code.toLowerCase();
      const isMatch = term && (lc.includes(term) || (SOFT_LABELS[lc]||'').toLowerCase().includes(term));
      return '<div class="soft-box'+(isMatch?' match':'')+'" title="'+(SOFT_LABELS[lc]||code)+'">'
        + '<div class="code">'+code+'</div>'
        + '<div class="ver">v'+fmtNum(info.version)+'</div>'
        + '<div class="sz">'+fmtSize(info.size)+'</div>'
        + '</div>';
    }).join('');
  }

  let riddleHTML = '';
  if(rec.cat === 'RIDDLE TRAIL NPC' && (rec.q || rec.a)){
    riddleHTML = '<div class="riddle-box">'
      + '<div class="q"><b>Q:</b> '+escapeHTML(rec.q)+'</div>'
      + '<div class="a"><b>A:</b> '+escapeHTML(rec.a)+'</div>'
      + '</div>';
  }

  return '<div class="card" data-cat="'+rec.cat+'" style="--card-accent:'+meta.color+'">'
    + '<div class="card-head">'
      + '<div class="card-head-l">'
        + '<div class="cat-badge" style="color:'+meta.color+'">'+meta.short+'</div>'
        + '<div class="npc-name">'+escapeHTML(rec.name)+'</div>'
        + (rec.note ? '<div class="npc-note">'+escapeHTML(rec.note)+'</div>' : '')
      + '</div>'
      + '<div style="text-align:right">'
        + '<div class="ip-pill" onclick="navigator.clipboard&&navigator.clipboard.writeText(\''+rec.ip+'\')" title="click to copy">'+rec.ip+'</div>'
        + '<div class="rate-row">'
          + '<div class="rate-line rl-spam'+(best.type==='SPAM'?' best':'')+'">SPAM $'+Math.round(best.spam).toLocaleString()+'/hr</div>'
          + '<div class="rate-line rl-miner'+(best.type==='MINER'?' best':'')+'">BTC $'+Math.round(best.miner).toLocaleString()+'/hr'
            + (best.minerBtc!=null ? ' &middot; '+best.minerBtc.toFixed(6)+' BTC/hr' : '')
            + '</div>'
          + '<div class="rate-line rl-warez'+(best.type==='WAREZ'?' best':'')+'">WAREZ $'+Math.round(best.warez).toLocaleString()+'/hr</div>'
        + '</div>'
        + (rec.num ? '<div class="num-badge">#'+rec.num+'</div>' : '')
      + '</div>'
    + '</div>'
    + '<div class="stat-strip">'
      + statBox('CPU', fmtNum(rec.cpu))
      + statBox('RAM', fmtNum(rec.ram))
      + statBox('HDD', fmtNum(rec.hdd))
      + statBox('NET', fmtNum(rec.net))
      + statBox('SPD', fmtNum(rec.speed1))
    + '</div>'
    + '<div class="soft-grid">'+softHTML+'</div>'
    + riddleHTML
    + '</div>';
}
function statBox(k,v){
  return '<div class="stat-box"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>';
}
function escapeHTML(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function matches(rec, term){
  if(activeCat && rec.cat !== activeCat) return false;
  if(activeVirus && rec._best.type !== activeVirus) return false;
  if(!term) return true;
  const hay = [
    rec.name, rec.ip, rec.cat, rec.note, rec.q, rec.a,
    ...Object.keys(rec.soft||{}),
    ...Object.keys(rec.soft||{}).map(c => SOFT_LABELS[c.toLowerCase()] || '')
  ].join(' ').toLowerCase();
  return hay.includes(term);
}

function render(){
  const raw = searchInput.value.trim().toLowerCase();
  clearBtn.style.display = raw ? 'inline-block' : 'none';
  let results = RECORDS.filter(r => matches(r, raw));

  if(raw){
    const sortCode = resolveSortCode(raw);
    results = results.slice().sort((a,b) => {
      const av = (a.soft && a.soft[sortCode] && a.soft[sortCode].version != null) ? a.soft[sortCode].version : null;
      const bv = (b.soft && b.soft[sortCode] && b.soft[sortCode].version != null) ? b.soft[sortCode].version : null;
      if(av == null && bv == null) return 0;
      if(av == null) return 1;
      if(bv == null) return -1;
      return bv - av;
    });
  }

  hitCountEl.textContent = results.length;
  currentResults = results;

  if(raw && SOFT_LABELS[raw]){
    softHintEl.textContent = '• matches highlighted for "'+raw+'" ('+SOFT_LABELS[raw]+')';
  } else {
    softHintEl.textContent = '';
  }

  if(results.length === 0){
    grid.style.display = 'none';
    emptyState.style.display = 'block';
    return;
  }
  grid.style.display = 'grid';
  emptyState.style.display = 'none';
  grid.innerHTML = results.map(r => cardHTML(r, raw)).join('');
}

function updateVirusChipCounts(){
  VIRUS_TYPES.forEach(v => {
    const count = RECORDS.filter(r => r._best.type === v.type).length;
    const chip = virusFilters.querySelector('[data-virus="'+v.type+'"]');
    if(chip) chip.textContent = v.label + ' (' + count + ')';
  });
}

const loadoutHintEl = document.getElementById('loadoutHint');
function updateLoadoutHint(){
  if(!loadout.btc || loadout.btc <= 0){
    loadoutHintEl.textContent = 'no BTC price entered — Miner is being priced at the $'+BTC_REF_PRICE.toLocaleString()+' reference rate until you enter the current price above';
    loadoutHintEl.classList.add('show');
  } else {
    loadoutHintEl.classList.remove('show');
  }
}

function recalcAll(){
  RECORDS.forEach(r => { r._best = bestVirus(r); });
  updateVirusChipCounts();
  updateLoadoutHint();
  render();
}

const loadInputs = {
  warez: document.getElementById('lv-warez'),
  spam: document.getElementById('lv-spam'),
  miner: document.getElementById('lv-miner'),
  collector: document.getElementById('lv-collector'),
  btc: document.getElementById('lv-btc')
};
loadInputs.warez.value = loadout.warez;
loadInputs.spam.value = loadout.spam;
loadInputs.miner.value = loadout.miner;
loadInputs.collector.value = loadout.collector;
loadInputs.btc.value = loadout.btc != null ? loadout.btc : '';
updateLoadoutHint();

['warez','spam','miner','collector'].forEach(key => {
  loadInputs[key].addEventListener('input', () => {
    const v = parseFloat(loadInputs[key].value);
    loadout[key] = Number.isFinite(v) ? v : 0;
    saveLoadout();
    recalcAll();
  });
});
loadInputs.btc.addEventListener('input', () => {
  const v = parseFloat(loadInputs.btc.value);
  loadout.btc = (Number.isFinite(v) && v > 0) ? v : null;
  saveLoadout();
  recalcAll();
});

searchInput.addEventListener('input', render);
clearBtn.addEventListener('click', () => { searchInput.value=''; render(); searchInput.focus(); });

copyIpsBtn.addEventListener('click', () => {
  const ips = currentResults.map(r => r.ip).join('\n');
  if(!ips) return;
  const done = () => {
    copyIpsBtn.classList.add('copied');
    setTimeout(() => copyIpsBtn.classList.remove('copied'), 1100);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ips).then(done).catch(done);
  } else {
    const ta = document.createElement('textarea');
    ta.value = ips; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    done();
  }
});

const MD_VIRUS_LABEL = {SPAM:'Spam', MINER:'Miner', WAREZ:'Warez'};
downloadAutoInfectBtn.addEventListener('click', () => {
  if(!currentResults.length) return;
  const lines = currentResults.map(r => r.ip + ' - ' + (MD_VIRUS_LABEL[r._best.type] || r._best.type));
  const content = '# Known IPs\n' + lines.join('\n') + '\n';
  const blob = new Blob([content], {type:'text/markdown'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'autoInfect.md';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  downloadAutoInfectBtn.classList.add('copied');
  setTimeout(() => downloadAutoInfectBtn.classList.remove('copied'), 1100);
});

render();
</script>
</body>
</html>
